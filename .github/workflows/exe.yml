name: Crear programa para Windows (.exe)
on:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar app
        shell: bash
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f licencia-publica.json ]; then cp licencia-publica.json www/licencia-publica.json; fi
          npm install
      - name: Compilar
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: StockPro-Windows
          path: |
            dist/*.exe
